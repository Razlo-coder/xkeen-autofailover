name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend and test
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          go test ./... -count=1
          go vet ./...
      - name: Build binaries and manifest
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o build/xkeen-panel-aarch64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags='-s -w' -o build/xkeen-panel-armv7 .
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags='-s -w' -o build/xkeen-panel-mipsel .
          cp install.sh config.autofailover.yaml build/
          cd build
          sha256sum xkeen-panel-* install.sh config.autofailover.yaml > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*
